version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=megano_db
      - POSTGRES_USER=megano_user
      - POSTGRES_PASSWORD=megano_password
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
        sh -c "while ! nc -z db 5432; do sleep 0.1; done;
              python diploma-backend/manage.py migrate &&
              python diploma-backend/manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://megano_user:megano_password@db:5432/megano_db
      - PYTHONPATH=/app/diploma-frontend

volumes:
  postgres_data:
